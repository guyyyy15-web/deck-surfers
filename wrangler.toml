# החצר's website: the Cloudflare Worker "hechatzer", built from GitHub on every push to main (Workers Builds).
# It serves only chatzer/ (static files, no code), with the headers in chatzer/_headers.
# The API is a different Worker: server/wrangler.toml (env "chatzer"). Keep this file TOML: wrangler looks for
# .json/.jsonc up the tree before .toml, so a .jsonc here would shadow server/wrangler.toml.
name = "hechatzer"
compatibility_date = "2026-11-10"

[assets]
directory = "./chatzer"

[observability]
enabled = true
