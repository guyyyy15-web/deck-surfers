name = "nekamot-sync"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
# Logs and errors in the Cloudflare dashboard (Workers → nekamot-sync → Logs). Bodies are never logged.
[observability]
enabled = true


[vars]
# Only the app's own address may call the API from a browser.
ALLOWED_ORIGINS = "https://guyyyy15-web.github.io"
ALLOW_LOCALHOST = "0"

[[d1_databases]]
binding = "DB"
database_name = "nekamot-sync"
database_id = "941dd83f-43f4-494f-a292-d45cdca03d7c"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "nekamot-photos"
