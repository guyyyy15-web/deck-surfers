name = "nekamot-sync"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
# Logs and errors in the Cloudflare dashboard (Workers → nekamot-sync → Logs). Bodies are never logged.
[observability]
enabled = true


[vars]
# Only the app's own address may call the API from a browser.
ALLOWED_ORIGINS = "https://guyyyy15-web.github.io"
ALLOW_LOCALHOST = "0"
# Web Push: the public half of the VAPID key (the private half is a Wrangler secret, VAPID_PRIVATE_JWK).
VAPID_PUBLIC = "BGHly8oQN3JLmnZZxqiTe__eUUzM3Vq2jIoXUXv63KCzyCbTYz1TLBrizX0JmN9Kf7rfPhiWvaOT_lGVcz08rOE"
VAPID_SUBJECT = "https://guyyyy15-web.github.io/deck-surfers/"

[[d1_databases]]
binding = "DB"
database_name = "nekamot-sync"
database_id = "941dd83f-43f4-494f-a292-d45cdca03d7c"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "nekamot-photos"

# ---- החצר (hechatzer.pages.dev): same code, its own Worker, database and photos. ----
# Deploy: npx wrangler d1 migrations apply chatzer --remote --env chatzer && npx wrangler deploy --env chatzer
[env.chatzer]
name = "chatzer-sync"
workers_dev = true

[env.chatzer.observability]
enabled = true

[env.chatzer.vars]
ALLOWED_ORIGINS = "https://hechatzer.guyyyy15-web.workers.dev,https://hechatzer.pages.dev"
ALLOW_LOCALHOST = "0"
VAPID_PUBLIC = "BKHgn2VUUglExb_yw8B83jzk6mjIqM-K4h9uMZO4p0UzRGMMgVQtEhWstdsbqUp50chGIzZfDcRTkpD59ciS5g4"
VAPID_SUBJECT = "https://hechatzer.guyyyy15-web.workers.dev/"

[[env.chatzer.d1_databases]]
binding = "DB"
database_name = "chatzer"
database_id = "0a0f12ad-da85-4499-8152-6d18874e9ce9"
migrations_dir = "migrations"

[[env.chatzer.r2_buckets]]
binding = "PHOTOS"
bucket_name = "chatzer-photos"
