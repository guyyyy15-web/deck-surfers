<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="נקמות שלי">
  <meta name="theme-color" content="#fcf1e7">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="האפליקציה לניהול נקמות קטנות וגדולות. הכל נשמר רק בטלפון שלך.">
  <title>נקמות שלי</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/fredoka-hebrew.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/rubik-hebrew.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Theme before first paint, so dark mode never flashes light.
    try {
      var s = JSON.parse(localStorage.getItem('nk.settings') || '{}'), t = s.theme || 'auto'
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      if (dark) document.querySelector('meta[name="theme-color"]').content = '#1d1521'
    } catch (e) {}
  </script>
</head>
<body>
  <div id="splash" class="splash" aria-live="polite">
    <div class="deco checker" aria-hidden="true" style="top:-40px;left:20%;width:320px;height:200px;border-radius:0 0 46% 54% / 0 0 60% 40%;background-size:48px 48px"></div>
    <div class="deco checker" aria-hidden="true" style="bottom:-50px;right:-40px;width:300px;height:170px;border-radius:58% 42% 0 0 / 55% 45% 0 0;background-size:48px 48px"></div>
    <div class="deco" aria-hidden="true" style="bottom:-60px;left:-30px;width:200px;height:130px;border-radius:50% 50% 0 0;background:var(--lilac-100)"></div>
    <svg class="deco" aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" style="top:21%;left:11%;transform:rotate(-14deg)" fill="var(--lilac-300)" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"><path d="M12 20s-7.5-4.4-7.5-10.2A4.2 4.2 0 0 1 12 7.2a4.2 4.2 0 0 1 7.5 2.6C19.5 15.6 12 20 12 20z"/></svg>
    <svg class="deco" aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" style="top:19.5%;right:13%" fill="var(--sun)" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3c.8 5.6 3.4 8.2 9 9-5.6.8-8.2 3.4-9 9-.8-5.6-3.4-8.2-9-9 5.6-.8 8.2-3.4 9-9z"/></svg>
    <svg class="deco" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" style="top:24.6%;right:23.5%" fill="var(--ink)"><path d="M12 3c.8 5.6 3.4 8.2 9 9-5.6.8-8.2 3.4-9 9-.8-5.6-3.4-8.2-9-9 5.6-.8 8.2-3.4 9-9z"/></svg>
    <svg class="cat-bob" role="img" aria-label="חתלתול" width="190" height="150" viewBox="0 0 190 150" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 70 L46 18 L82 46 Q95 42 108 46 L144 18 L150 70 Q160 96 150 116 Q130 146 95 146 Q60 146 40 116 Q30 96 40 70z" fill="var(--surface-raised)"/>
      <path d="M52 30 L56 56 L74 46z" fill="var(--blush)" stroke-width="0"/><path d="M138 30 L134 56 L116 46z" fill="var(--blush)" stroke-width="0"/>
      <path d="M62 88 Q70 80 78 88"/><path d="M112 88 Q120 80 128 88"/>
      <ellipse cx="62" cy="104" rx="9" ry="5" fill="var(--blush)" stroke-width="0"/><ellipse cx="128" cy="104" rx="9" ry="5" fill="var(--blush)" stroke-width="0"/>
      <path d="M90 100 L100 100 L95 106z" fill="var(--ink)" stroke-width="2"/><path d="M95 106 Q90 114 84 110 M95 106 Q100 114 106 110"/>
      <path d="M30 96 L12 92 M30 106 L14 110 M160 96 L178 92 M160 106 L176 110" stroke-width="3"/>
    </svg>
    <div class="blob"><h1>נקמות שלי</h1></div>
    <p>האפליקציה לניהול נקמות קטנות וגדולות</p>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <span data-loading style="margin-top:12px;font-size:15px;line-height:22px;font-weight:500;color:var(--ink-muted)">טוענת את הנקמות שלך…</span>
  </div>
  <div id="app"></div>
  <noscript><p style="padding:24px">האפליקציה צריכה JavaScript כדי לעבוד.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
