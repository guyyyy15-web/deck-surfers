# Every push and pull request runs all the tests: unit, server API (local Worker), and the iPhone
# browser tests (one phone, then two phones syncing through the local Worker).
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        timeout-minutes: 4
      - run: npm test
        timeout-minutes: 5

  browser:
    runs-on: ubuntu-latest
    needs: [unit, server]
    timeout-minutes: 30
    # The official image already has Chromium and its system libraries, so nothing is downloaded at
    # test time (installing them on the runner is what hung the first CI run).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
        timeout-minutes: 4
      - run: npm install --no-save playwright@1.63.0
        timeout-minutes: 3
      - run: node scripts/smoke.cjs
        timeout-minutes: 6
      - run: node scripts/smoke.cjs
        name: Android smoke (Pixel 7)
        env:
          DEVICE: Pixel 7
        timeout-minutes: 6
      - run: node scripts/sync-smoke.cjs
        timeout-minutes: 8
      - run: node scripts/groups-smoke.cjs
        timeout-minutes: 10
      - run: node scripts/chatzer-smoke.cjs
        name: החצר (3 phones)
        timeout-minutes: 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
